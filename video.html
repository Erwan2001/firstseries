<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture — Firsteries.io</title>
  <link rel="stylesheet" href="css/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9676956727833326"
          crossorigin="anonymous"></script>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">Firsteries<span>.io</span></a>
  </header>

  <main>
    <div id="player-container" class="player-container"></div>

    <div class="adsense-ad">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-9676956727833326"
           data-ad-slot="5333532359"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>

    <div class="video-infos">
      <a id="retour-serie" class="retour-serie" href="#">&larr; Retour à la série</a>
      <h2 id="episode-titre">Chargement...</h2>
      <p id="serie-synopsis-player"></p>
    </div>

    <section class="commentaires" id="commentaires" hidden>
      <h3 class="commentaires-titre">
        Commentaires <span id="commentaires-compteur"></span>
      </h3>

      <form class="commentaire-form" id="form-commentaire">
        <input
          type="text"
          id="commentaire-pseudo"
          class="commentaire-input"
          placeholder="Ton pseudo (optionnel)"
          maxlength="30"
        >
        <textarea
          id="commentaire-texte"
          class="commentaire-textarea"
          rows="3"
          maxlength="1000"
          placeholder="Ton avis sur cet épisode..."
        ></textarea>
        <div class="commentaire-form-bas">
          <p class="commentaire-erreur" id="commentaire-erreur"></p>
          <button type="submit" id="commentaire-envoyer">Publier</button>
        </div>
      </form>

      <div class="commentaires-liste" id="commentaires-liste"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/commentaires.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
