<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirstSeries.io</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">FirstSeries<span>.io</span></a>

    <div class="header-center">
      <div class="genre-select-wrapper">
        <label for="genre-select">Genre</label>
        <select id="genre-select">
          <option value="">Tous les genres</option>
          <option value="action">Action</option>
          <option value="aventure">Aventure</option>
          <option value="comedie">Comédie</option>
          <option value="drame">Drame</option>
          <option value="fantastique">Fantastique</option>
          <option value="horreur">Horreur</option>
          <option value="policier">Policier</option>
          <option value="science-fiction">Science-Fiction</option>
          <option value="thriller">Thriller</option>
        </select>
      </div>
    </div>

    <input type="text" id="search-bar" placeholder="Rechercher une série...">
  </header>

  <main>
    <!-- Hero Slider -->
    <section id="hero-slider" class="hero-slider">
      <div id="hero-slides" class="hero-slides"></div>
      <div class="hero-nav">
        <button id="hero-prev" class="hero-nav-btn hero-nav-prev">❮</button>
        <div id="hero-dots" class="hero-dots"></div>
        <button id="hero-next" class="hero-nav-btn hero-nav-next">❯</button>
      </div>
    </section>

    <!-- Catalogue -->
    <div class="catalogue-section">
      <h2 class="section-title">Toutes les séries</h2>
      <div id="serie-grid" class="video-grid">
        <p id="loading-msg">Chargement du catalogue...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>ALPHA | FirstSeries.io | by Le Maxi Phasme</p>
    <a href="admin.html" class="admin-link">Accéder à l’admin</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/catalogue.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
